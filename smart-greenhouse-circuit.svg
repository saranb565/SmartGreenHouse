<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">Smart Greenhouse System with ESP32</text>
  
  <!-- ESP32 Module -->
  <rect x="300" y="200" width="200" height="280" rx="10" fill="#e6e6e6" stroke="#000" stroke-width="2"/>
  <text x="400" y="225" text-anchor="middle" font-size="16" font-weight="bold">ESP32</text>
  
  <!-- ESP32 Pins -->
  <text x="320" y="250" font-size="12">3.3V</text>
  <text x="320" y="270" font-size="12">5V</text>
  <text x="320" y="290" font-size="12">GND</text>
  <text x="320" y="310" font-size="12">GPIO2</text>
  <text x="320" y="330" font-size="12">GPIO5</text>
  <text x="320" y="350" font-size="12">GPIO18</text>
  <text x="320" y="370" font-size="12">GPIO21</text>
  <text x="320" y="390" font-size="12">GPIO33</text>
  <text x="320" y="410" font-size="12">GPIO34</text>
  
  <!-- DHT22 Sensor -->
  <rect x="100" y="100" width="100" height="80" rx="5" fill="#d0e0ff" stroke="#000" stroke-width="2"/>
  <text x="150" y="130" text-anchor="middle" font-size="14" font-weight="bold">DHT22</text>
  <text x="150" y="150" text-anchor="middle" font-size="12">Temperature &</text>
  <text x="150" y="170" text-anchor="middle" font-size="12">Humidity Sensor</text>
  
  <!-- DHT22 Connection -->
  <line x1="200" y1="140" x2="260" y2="140" stroke="#ff0000" stroke-width="2"/>
  <line x1="260" y1="140" x2="260" y2="250" stroke="#ff0000" stroke-width="2"/>
  <line x1="260" y1="250" x2="300" y2="250" stroke="#ff0000" stroke-width="2"/>
  <text x="230" y="130" font-size="10">VCC (3.3V)</text>
  
  <line x1="200" y1="150" x2="270" y2="150" stroke="#000000" stroke-width="2"/>
  <line x1="270" y1="150" x2="270" y2="290" stroke="#000000" stroke-width="2"/>
  <line x1="270" y1="290" x2="300" y2="290" stroke="#000000" stroke-width="2"/>
  <text x="230" y="160" font-size="10">GND</text>
  
  <line x1="200" y1="160" x2="280" y2="160" stroke="#00ff00" stroke-width="2"/>
  <line x1="280" y1="160" x2="280" y2="330" stroke="#00ff00" stroke-width="2"/>
  <line x1="280" y1="330" x2="300" y2="330" stroke="#00ff00" stroke-width="2"/>
  <text x="230" y="175" font-size="10">DATA (GPIO5)</text>
  
  <!-- Soil Moisture Sensor -->
  <rect x="100" y="220" width="100" height="80" rx="5" fill="#d0ffd0" stroke="#000" stroke-width="2"/>
  <text x="150" y="250" text-anchor="middle" font-size="14" font-weight="bold">Soil</text>
  <text x="150" y="270" text-anchor="middle" font-size="12">Moisture</text>
  <text x="150" y="290" text-anchor="middle" font-size="12">Sensor</text>
  
  <!-- Soil Moisture Connection -->
  <line x1="200" y1="240" x2="260" y2="240" stroke="#ff0000" stroke-width="2"/>
  <line x1="260" y1="240" x2="260" y2="270" stroke="#ff0000" stroke-width="2"/>
  <line x1="260" y1="270" x2="300" y2="270" stroke="#ff0000" stroke-width="2"/>
  <text x="230" y="230" font-size="10">VCC (3.3V)</text>
  
  <line x1="200" y1="260" x2="270" y2="260" stroke="#000000" stroke-width="2"/>
  <line x1="270" y1="260" x2="270" y2="290" stroke="#000000" stroke-width="2"/>
  <text x="230" y="255" font-size="10">GND</text>
  
  <line x1="200" y1="280" x2="290" y2="280" stroke="#0000ff" stroke-width="2"/>
  <line x1="290" y1="280" x2="290" y2="390" stroke="#0000ff" stroke-width="2"/>
  <line x1="290" y1="390" x2="300" y2="390" stroke="#0000ff" stroke-width="2"/>
  <text x="230" y="295" font-size="10">AO (GPIO33)</text>
  
  <!-- LDR Light Sensor -->
  <rect x="100" y="340" width="100" height="120" rx="5" fill="#ffffd0" stroke="#000" stroke-width="2"/>
  <text x="150" y="370" text-anchor="middle" font-size="14" font-weight="bold">LDR</text>
  <text x="150" y="390" text-anchor="middle" font-size="12">Light Sensor</text>
  <text x="150" y="410" text-anchor="middle" font-size="12">with</text>
  <text x="150" y="430" text-anchor="middle" font-size="12">Voltage Divider</text>
  
  <!-- LDR Circuit -->
  <circle cx="130" cy="390" r="10" fill="white" stroke="black" stroke-width="1"/>
  <path d="M120,390 L140,390 M130,380 L130,400" stroke="black" stroke-width="1"/>
  <line x1="130" y1="400" x2="130" y2="420" stroke="black" stroke-width="2"/>
  <line x1="130" y1="420" x2="170" y2="420" stroke="black" stroke-width="2"/>
  <rect x="150" y="380" width="8" height="40" fill="#a0522d" stroke="black" stroke-width="1"/>
  <line x1="150" y1="380" x2="170" y2="380" stroke="black" stroke-width="2"/>
  <line x1="170" y1="380" x2="170" y2="350" stroke="black" stroke-width="2"/>
  <text x="170" y="375" font-size="8">10kΩ</text>
  
  <!-- LDR Connection -->
  <line x1="170" y1="350" x2="250" y2="350" stroke="#ff0000" stroke-width="2"/>
  <line x1="250" y1="350" x2="250" y2="250" stroke="#ff0000" stroke-width="2"/>
  <text x="205" y="340" font-size="10">VCC (3.3V)</text>
  
  <line x1="130" y1="420" x2="130" y2="450" stroke="#000000" stroke-width="2"/>
  <line x1="130" y1="450" x2="250" y2="450" stroke="#000000" stroke-width="2"/>
  <line x1="250" y1="450" x2="250" y2="290" stroke="#000000" stroke-width="2"/>
  <text x="180" y="465" font-size="10">GND</text>
  
  <line x1="150" y1="400" x2="240" y2="400" stroke="#ff00ff" stroke-width="2"/>
  <line x1="240" y1="400" x2="240" y2="410" stroke="#ff00ff" stroke-width="2"/>
  <line x1="240" y1="410" x2="300" y2="410" stroke="#ff00ff" stroke-width="2"/>
  <text x="210" y="390" font-size="10">A0 (GPIO34)</text>
  
  <!-- Relay Module -->
  <rect x="600" y="100" width="100" height="80" rx="5" fill="#ffd0d0" stroke="#000" stroke-width="2"/>
  <text x="650" y="130" text-anchor="middle" font-size="14" font-weight="bold">Relay</text>
  <text x="650" y="150" text-anchor="middle" font-size="12">Module</text>
  <text x="650" y="170" text-anchor="middle" font-size="12">1-Channel</text>
  
  <!-- Relay Connection -->
  <line x1="600" y1="120" x2="540" y2="120" stroke="#ff0000" stroke-width="2"/>
  <line x1="540" y1="120" x2="540" y2="270" stroke="#ff0000" stroke-width="2"/>
  <line x1="540" y1="270" x2="500" y2="270" stroke="#ff0000" stroke-width="2"/>
  <text x="560" y="110" font-size="10">VCC (5V)</text>
  
  <line x1="600" y1="140" x2="550" y2="140" stroke="#000000" stroke-width="2"/>
  <line x1="550" y1="140" x2="550" y2="290" stroke="#000000" stroke-width="2"/>
  <line x1="550" y1="290" x2="500" y2="290" stroke="#000000" stroke-width="2"/>
  <text x="560" y="150" font-size="10">GND</text>
  
  <line x1="600" y1="160" x2="560" y2="160" stroke="#ffa500" stroke-width="2"/>
  <line x1="560" y1="160" x2="560" y2="350" stroke="#ffa500" stroke-width="2"/>
  <line x1="560" y1="350" x2="500" y2="350" stroke="#ffa500" stroke-width="2"/>
  <text x="560" y="175" font-size="10">IN (GPIO18)</text>
  
  <!-- Water Pump -->
  <rect x="680" y="150" width="60" height="40" rx="5" fill="#d0d0ff" stroke="#000" stroke-width="2"/>
  <text x="710" y="175" text-anchor="middle" font-size="12">Water</text>
  <text x="710" y="190" text-anchor="middle" font-size="12">Pump</text>
  
  <line x1="680" y1="170" x2="660" y2="170" stroke="#800000" stroke-width="2"/>
  <line x1="660" y1="170" x2="660" y2="130" stroke="#800000" stroke-width="2"/>
  <line x1="660" y1="130" x2="650" y2="130" stroke="#800000" stroke-width="2"/>
  
  <!-- LEDs -->
  <rect x="600" y="220" width="120" height="100" rx="5" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
  <text x="660" y="240" text-anchor="middle" font-size="14" font-weight="bold">Grow LEDs</text>
  <text x="660" y="255" text-anchor="middle" font-size="12">(3 in parallel)</text>
  
  <!-- LED Symbols -->
  <circle cx="630" cy="280" r="10" fill="none" stroke="#000" stroke-width="1"/>
  <polygon points="625,280 635,280 630,290" fill="#00ff00" stroke="#000" stroke-width="1"/>
  <line x1="622" y1="272" x2="618" y2="268" stroke="#000" stroke-width="1"/>
  <line x1="638" y1="272" x2="642" y2="268" stroke="#000" stroke-width="1"/>
  
  <circle cx="660" cy="280" r="10" fill="none" stroke="#000" stroke-width="1"/>
  <polygon points="655,280 665,280 660,290" fill="#00ff00" stroke="#000" stroke-width="1"/>
  <line x1="652" y1="272" x2="648" y2="268" stroke="#000" stroke-width="1"/>
  <line x1="668" y1="272" x2="672" y2="268" stroke="#000" stroke-width="1"/>
  
  <circle cx="690" cy="280" r="10" fill="none" stroke="#000" stroke-width="1"/>
  <polygon points="685,280 695,280 690,290" fill="#00ff00" stroke="#000" stroke-width="1"/>
  <line x1="682" y1="272" x2="678" y2="268" stroke="#000" stroke-width="1"/>
  <line x1="698" y1="272" x2="702" y2="268" stroke="#000" stroke-width="1"/>
  
  <!-- LED Resistor -->
  <rect x="650" y="300" width="20" height="10" fill="#a0522d" stroke="#000" stroke-width="1"/>
  <text x="660" y="320" text-anchor="middle" font-size="8">220Ω</text>
  
  <!-- LED Connection -->
  <line x1="660" y1="310" x2="660" y2="330" stroke="#00aa00" stroke-width="2"/>
  <line x1="660" y1="330" x2="570" y2="330" stroke="#00aa00" stroke-width="2"/>
  <line x1="570" y1="330" x2="570" y2="370" stroke="#00aa00" stroke-width="2"/>
  <line x1="570" y1="370" x2="500" y2="370" stroke="#00aa00" stroke-width="2"/>
  <text x="590" y="350" font-size="10">GPIO21</text>
  
  <line x1="630" y1="270" x2="630" y2="260" stroke="#ff0000" stroke-width="2"/>
  <line x1="660" y1="270" x2="660" y2="260" stroke="#ff0000" stroke-width="2"/>
  <line x1="690" y1="270" x2="690" y2="260" stroke="#ff0000" stroke-width="2"/>
  <line x1="630" y1="260" x2="690" y2="260" stroke="#ff0000" stroke-width="2"/>
  <line x1="660" y1="260" x2="660" y2="210" stroke="#ff0000" stroke-width="2"/>
  <line x1="660" y1="210" x2="540" y2="210" stroke="#ff0000" stroke-width="2"/>
  <text x="600" y="200" font-size="10">VCC (5V)</text>
  
  <line x1="630" y1="290" x2="630" y2="300" stroke="#000000" stroke-width="2"/>
  <line x1="660" y1="290" x2="660" y2="300" stroke="#000000" stroke-width="2"/>
  <line x1="690" y1="290" x2="690" y2="300" stroke="#000000" stroke-width="2"/>
  <line x1="630" y1="300" x2="650" y2="300" stroke="#000000" stroke-width="2"/>
  <line x1="670" y1="300" x2="690" y2="300" stroke="#000000" stroke-width="2"/>
  
  <!-- Status LED -->
  <rect x="400" y="520" width="100" height="60" rx="5" fill="#ffd700" stroke="#000" stroke-width="2"/>
  <text x="450" y="540" text-anchor="middle" font-size="14" font-weight="bold">Status LED</text>
  <text x="450" y="555" text-anchor="middle" font-size="12">(Onboard)</text>
  <text x="450" y="570" text-anchor="middle" font-size="12">GPIO2</text>
  
  <line x1="400" y1="540" x2="350" y2="540" stroke="#ffaa00" stroke-width="2"/>
  <line x1="350" y1="540" x2="350" y2="310" stroke="#ffaa00" stroke-width="2"/>
  <line x1="350" y1="310" x2="300" y2="310" stroke="#ffaa00" stroke-width="2"/>
  
  <!-- Legend -->
  <rect x="600" y="400" width="180" height="180" rx="5" fill="white" stroke="#000" stroke-width="1"/>
  <text x="690" y="420" text-anchor="middle" font-size="14" font-weight="bold">Legend</text>
  
  <line x1="610" y1="440" x2="640" y2="440" stroke="#ff0000" stroke-width="2"/>
  <text x="720" y="445" text-anchor="middle" font-size="12">Power (3.3V/5V)</text>
  
  <line x1="610" y1="465" x2="640" y2="465" stroke="#000000" stroke-width="2"/>
  <text x="700" y="470" text-anchor="middle" font-size="12">Ground</text>
  
  <line x1="610" y1="490" x2="640" y2="490" stroke="#00ff00" stroke-width="2"/>
  <text x="705" y="495" text-anchor="middle" font-size="12">DHT22 Data</text>
  
  <line x1="610" y1="515" x2="640" y2="515" stroke="#0000ff" stroke-width="2"/>
  <text x="715" y="520" text-anchor="middle" font-size="12">Soil Moisture</text>
  
  <line x1="610" y1="540" x2="640" y2="540" stroke="#ff00ff" stroke-width="2"/>
  <text x="700" y="545" text-anchor="middle" font-size="12">Light Sensor</text>
  
  <line x1="610" y1="565" x2="640" y2="565" stroke="#ffa500" stroke-width="2"/>
  <text x="695" y="570" text-anchor="middle" font-size="12">Relay Control</text>
</svg>
